<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Preview Kunpeng Ding's CV.">
  <meta name="theme-color" content="#102d49">
  <title>CV Preview | Kunpeng Ding</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17344a;
      background: #edf2f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px max(18px, calc((100vw - 960px) / 2));
      background: rgba(16, 45, 73, .97);
      color: white;
      box-shadow: 0 2px 12px rgba(10, 32, 49, .15);
    }
    .toolbar a { color: inherit; font-size: .9rem; font-weight: 700; text-decoration: none; }
    .toolbar a:hover { text-decoration: underline; }
    .home-link { display: flex; align-items: center; gap: 10px; }
    .brand { font-size: 1.05rem !important; letter-spacing: .03em; }
    .download-link {
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 8px;
      white-space: nowrap;
    }
    main { width: min(960px, calc(100% - 32px)); margin: 28px auto 44px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .intro { margin: 0 0 18px; color: #526575; line-height: 1.6; }
    .cv-page { margin: 0; text-align: center; }
    .cv-page img {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      margin: 0 auto;
      border: 1px solid #d5e0e7;
      border-radius: 4px;
      background: white;
      box-shadow: 0 8px 28px rgba(20, 46, 64, .12);
    }
    .original-link { margin: 16px 0 0; color: #526575; text-align: center; font-size: .9rem; }
    .original-link a { color: #17648b; font-weight: 700; }
    @media (max-width: 600px) {
      .toolbar { padding: 10px 12px; gap: 8px; }
      .toolbar a { font-size: .82rem; }
      main { width: calc(100% - 20px); margin-top: 20px; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <a class="home-link" href="./index.html"><span class="brand">KD.</span><span>Back to homepage</span></a>
    <a class="download-link" href="./cv.pdf" download>Download PDF</a>
  </header>
  <main>
    <h1>Curriculum Vitae</h1>
    <p class="intro">Preview the CV below, or download the original PDF.</p>
    <figure class="cv-page">
      <img src="./assets/cv-page.webp" width="1489" height="2105" alt="One-page CV preview" fetchpriority="high" decoding="async">
    </figure>
    <p class="original-link">Need the original document? <a href="./cv.pdf" target="_blank" rel="noopener">Open the PDF</a>.</p>
  </main>
</body>
</html>
